<meta name="theme-color" id="meta-theme" content="#F4F6FA">
<script>
/* Anti-FOUC: aplica el tema guardado antes de pintar */
(function () {
  var dark = false;
  try {
    var saved = localStorage.getItem('deltos-theme'); /* 'light' | 'dark' | 'auto' | null */
    dark = saved === 'dark' ? true
         : saved === 'light' ? false
         : window.matchMedia('(prefers-color-scheme: dark)').matches; /* auto */
  } catch (e) {}
  if (dark) document.documentElement.classList.add('dark');
  var m = document.getElementById('meta-theme');
  if (m) m.setAttribute('content', dark ? '#080D1A' : '#F4F6FA');
})();
</script>

<script>
tailwind.config = {

  theme: {
    extend: {
      fontFamily: {
        display: ['"Space Grotesk"', 'sans-serif'],
        sans: ['Inter', 'system-ui', 'sans-serif']
      }
    }
  }
};
</script>
<style>
  /* --text-faint ajustado a contraste AA (>=4.5:1 sobre surface): #64748B claro / #7A8AA5 oscuro */
  :root { --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF1F6; --border:#E3E8F0; --text:#0C1425; --text-muted:#5B6B84; --text-faint:#64748B; }
  .dark { --bg:#080D1A; --surface:#101828; --surface-2:#182338; --border:#1E2B42; --text:#E9EEF7; --text-muted:#93A1B8; --text-faint:#7A8AA5; }

  html { -webkit-text-size-adjust: 100%; }
  body { background-color: var(--bg); color: var(--text); }

  /* Crossfade de tema: .45s ease en fondo, color y borde */
  *, *::before, *::after {
    transition-property: background-color, border-color, color, fill, stroke;
    transition-duration: .45s;
    transition-timing-function: ease;
  }

  /* Utilidades sobre los tokens */
  .bg-surface   { background-color: var(--surface); }
  .bg-surface2  { background-color: var(--surface-2); }
  .border-app   { border-color: var(--border); }
  .text-muted   { color: var(--text-muted); }
  .text-faint   { color: var(--text-faint); }
  .divide-app > :not([hidden]) ~ :not([hidden]) { border-color: var(--border); }

  .tnum { font-feature-settings: "tnum"; }

  .shadow-soft { box-shadow: 0 1px 2px rgba(12,20,37,.04), 0 4px 14px rgba(12,20,37,.05); }
  .dark .shadow-soft { box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35); }

  /* Foco visible */
  :focus-visible { outline: 2px solid #10B981; outline-offset: 2px; border-radius: 6px; }

  /* Entrada de tarjetas: opacity + translateY 8px, con stagger */
  @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .card { animation: card-in .35s ease both; }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    *, *::before, *::after { transition-duration: .01s !important; }
  }

  /* Scrollbars discretos */
  .nice-scroll { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .nice-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .nice-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .nice-scroll::-webkit-scrollbar-track { background: transparent; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Línea del timeline de actividad */
  .timeline { position: relative; }
  .timeline::before {
    content: ''; position: absolute; left: 13px; top: 10px; bottom: 10px;
    width: 2px; border-radius: 2px; background: var(--border);
  }
  .timeline > li { position: relative; }

  /* ---------- Drag & drop ---------- */
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { animation: none; opacity: .4; transform: rotate(1.5deg) scale(.98); cursor: grabbing; }
  .drop-placeholder {
    border: 2px dashed rgb(var(--accent, 148 163 184) / .55);
    border-radius: 1rem;
    background: rgb(var(--accent, 148 163 184) / .08);
  }
  section[data-col] { border-radius: 1rem; transition: background-color .2s ease, box-shadow .2s ease; }
  section[data-col].col-target {
    background-color: var(--surface-2);
    box-shadow: inset 0 0 0 1.5px rgb(var(--accent, 148 163 184) / .4);
  }
  /* Durante un re-render con FLIP se desactiva la animación de entrada */
  .no-anim .card { animation: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .card.dragging { transform: none; }
    section[data-col] { transition: none; }
  }
</style>

<script>
/* ---------- Estado ---------- */
const state = {
  view: 'todo', /* 'todo' | id de proyecto */
  seg: 'nuevo', /* estado seleccionado en el segmented control móvil */
  filters: { projects: new Set(), people: new Set(), priorities: new Set(), tags: new Set() },
  filtersOpen: false /* panel de filtros desplegado (solo afecta a <lg; en desktop siempre visible) */
};

const $ = (sel) => document.querySelector(sel);
const boardEl = $('#board'), filtersEl = $('#filters'), sideNavEl = $('#side-nav');
const TODAY = new Date(2026, 7, 1); /* 1 ago 2026 */

/* ---------- Helpers ---------- */
const projectOf = (t) => PROJECTS.find(p => p.id === t.project);
const openCount = (pid) => TASKS.filter(t => t.project === pid && t.col !== 'hecho').length;
const colName = (id) => COLUMNS.find(c => c.id === id).name;

function fmtDate(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace(/\./g, '');
}

function dueInfo(due) {
  if (!due) return null;
  const d = new Date(due + 'T00:00:00');
  const diff = Math.round((d - TODAY) / 864e5);
  if (diff < 0)  return { kind: 'over',  text: diff === -1 ? 'Ayer' : 'Vencida' };
  if (diff === 0) return { kind: 'today', text: 'Hoy' };
  if (diff === 1) return { kind: 'normal', text: 'Mañana' };
  return { kind: 'normal', text: fmtDate(due) };
}

function dueBadge(due, big) {
  const info = dueInfo(due);
  if (!info) return '';
  const base = 'inline-flex items-center gap-1 ' + (big ? 'text-[13px]' : 'text-[11px]') + ' font-medium whitespace-nowrap';
  const cal = svg(P.calendar, big ? 'w-4 h-4' : 'w-3.5 h-3.5');
  if (info.kind === 'over')
    return '<span class="' + base + ' px-1.5 py-0.5 rounded-md bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300">' + cal + info.text + '</span>';
  if (info.kind === 'today')
    return '<span class="' + base + ' px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300">' + cal + info.text + '</span>';
  return '<span class="' + base + ' text-faint">' + cal + info.text + '</span>';
}

function avatar(userId, cls) {
  if (!userId) return '';
  const u = USERS[userId];
  return '<span class="' + (cls || 'w-6 h-6 text-[10px]') + ' rounded-full ' + AVATAR[u.color] + ' inline-flex items-center justify-center font-semibold shrink-0" title="' + u.name + '">' + u.initials + '</span>';
}

function tagChip(tagId, big) {
  const g = TAGS[tagId];
  return '<span class="px-2 py-0.5 rounded-full ' + (big ? 'text-[12px]' : 'text-[11px]') + ' font-medium ' + COLORS[g.color].chip + '">' + g.name + '</span>';
}

function priorityBadge(pr) {
  const p = PRIORITIES[pr];
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ' + p.badge + '">' + svg(p.icon, 'w-3 h-3') + p.label + '</span>';
}

/* ---------- Tarjeta ---------- */
function cardHTML(t, i, showProject) {
  const done = t.col === 'hecho';
  const proj = projectOf(t);
  const delay = Math.min(i, 10) * 40;
  const counters = [];
  if (t.c > 0) counters.push('<span class="inline-flex items-center gap-1">' + svg(P.chat, 'w-3.5 h-3.5') + t.c + '</span>');
  if (t.a > 0) counters.push('<span class="inline-flex items-center gap-1">' + svg(P.clip, 'w-3.5 h-3.5') + t.a + '</span>');

  return '' +
  '<button type="button" data-task="' + t.id + '" draggable="true" style="animation-delay:' + delay + 'ms" ' +
    'class="card w-full text-left rounded-2xl bg-surface border border-app shadow-soft p-3.5 transition-transform duration-150 hover:-translate-y-0.5 hover:shadow-md ' + (done ? 'opacity-60' : '') + '">' +
    (showProject
      ? '<div class="flex items-center gap-1.5 mb-2"><span class="w-2 h-2 rounded-full ' + COLORS[proj.color].dot + '"></span><span class="text-[11px] font-medium text-muted truncate">' + proj.name + '</span></div>'
      : '') +
    (t.tags.length ? '<div class="flex flex-wrap gap-1.5 mb-2">' + t.tags.map(tagChip).join('') + '</div>' : '') +
    '<h3 class="text-[15px] font-medium leading-snug ' + (done ? 'line-through decoration-1' : '') + '">' + t.title + '</h3>' +
    ((t.pr || t.due) ? '<div class="flex flex-wrap items-center gap-1.5 mt-2.5">' + (t.pr ? priorityBadge(t.pr) : '') + dueBadge(t.due) + '</div>' : '') +
    '<div class="flex items-center justify-between mt-3 pt-2.5 border-t border-app">' +
      '<span class="tnum flex items-center gap-3 text-xs text-faint">' + counters.join('') + '</span>' +
      (t.as ? avatar(t.as) : '<span class="w-6 h-6 rounded-full border border-dashed border-app text-faint inline-flex items-center justify-center" title="Sin asignar">' + svg(P.user, 'w-3 h-3') + '</span>') +
    '</div>' +
  '</button>';
}

/* ---------- Tarjeta MÓVIL simplificada (<lg) ----------
   Solo: título (17px/600, 2 líneas), proyecto (dot + nombre 13px), prioridad (badge 12px).
   Sin etiquetas, fecha, avatar ni contadores: se ven al abrir el detalle. */
function cardHTMLMobile(t, i) {
  const done = t.col === 'hecho';
  const proj = projectOf(t);
  const delay = Math.min(i, 10) * 40;
  return '' +
  '<button type="button" data-task="' + t.id + '" style="animation-delay:' + delay + 'ms" ' +
    'class="card w-full text-left rounded-2xl bg-surface border border-app shadow-soft px-4 py-3.5 min-h-[64px] flex flex-col justify-center gap-2 ' + (done ? 'opacity-60' : '') + '">' +
    '<h3 class="text-[17px] font-semibold leading-snug line-clamp-2 ' + (done ? 'line-through decoration-1' : '') + '">' + t.title + '</h3>' +
    '<div class="flex items-center gap-x-3 gap-y-1.5 flex-wrap">' +
      '<span class="inline-flex items-center gap-1.5 min-w-0">' +
        '<span class="w-2 h-2 rounded-full shrink-0 ' + COLORS[proj.color].dot + '"></span>' +
        '<span class="text-[13px] text-muted truncate">' + proj.name + '</span>' +
      '</span>' +
      (t.pr
        ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[12px] font-medium ' + PRIORITIES[t.pr].badge + '">' + svg(PRIORITIES[t.pr].icon, 'w-3.5 h-3.5') + PRIORITIES[t.pr].label + '</span>'
        : '') +
    '</div>' +
  '</button>';
}

/* ---------- Tareas visibles (vista + filtros) ---------- */
function visibleTasks() {
  let list = state.view === 'todo' ? TASKS.slice() : TASKS.filter(t => t.project === state.view);
  if (state.view === 'todo') {
    const f = state.filters;
    if (f.projects.size)   list = list.filter(t => f.projects.has(t.project));
    if (f.people.size)     list = list.filter(t => f.people.has(t.as || 'none'));
    if (f.priorities.size) list = list.filter(t => t.pr && f.priorities.has(t.pr));
    if (f.tags.size)       list = list.filter(t => t.tags.some(g => f.tags.has(g)));
  }
  return list;
}

/* ---------- Tablero ---------- */
const ACCENT_RGB = { sky: '14 165 233', amber: '245 158 11', emerald: '16 185 129' };

function renderBoard() {
  const tasks = visibleTasks();
  const showProject = state.view === 'todo';
  boardEl.innerHTML = COLUMNS.map(col => {
    const list = tasks.filter(t => t.col === col.id);
    return '' +
    '<section data-col="' + col.id + '" style="--accent:' + (ACCENT_RGB[col.color] || '148 163 184') + '" class="flex flex-col" aria-label="Columna ' + col.name + '">' +
      '<header class="flex items-center gap-2 px-1 pb-3">' +
        '<span class="w-2.5 h-2.5 rounded-full ' + COLORS[col.color].dot + '"></span>' +
        '<h2 class="font-display font-semibold text-sm">' + col.name + '</h2>' +
        '<span class="tnum font-display text-xs text-faint" data-count>' + list.length + '</span>' +
        '<button type="button" class="ml-auto w-7 h-7 rounded-lg text-faint hover:bg-surface2 hover:text-muted flex items-center justify-center" aria-label="Añadir tarjeta a ' + col.name + '" title="Decorativo">' + svg(P.plus) + '</button>' +
      '</header>' +
      '<div data-list class="flex-1 space-y-3 overflow-y-auto nice-scroll max-h-[calc(100vh-215px)] pr-1.5 pb-1">' +
        (list.map((t, i) => cardHTML(t, i, showProject)).join('') ||
          '<p data-empty class="rounded-2xl border border-dashed border-app px-4 py-6 text-center text-sm text-muted">Sin tareas</p>') +
      '</div>' +
    '</section>';
  }).join('');
}

/* ---------- Segmented control móvil: Nuevo / En curso / Hecho con dot + contador ---------- */
function renderSeg() {
  const tasks = visibleTasks();
  const el = $('#seg-control');
  el.innerHTML = COLUMNS.map(c => {
    const n = tasks.filter(t => t.col === c.id).length;
    const active = state.seg === c.id;
    return '<button type="button" role="tab" data-seg="' + c.id + '" aria-selected="' + active + '" ' +
      'aria-label="' + c.name + ', ' + n + (n === 1 ? ' tarea' : ' tareas') + '" ' +
      'class="flex-1 min-w-0 flex items-center justify-center gap-1.5 rounded-full px-2 h-11 text-[13px] font-medium whitespace-nowrap ' +
      (active ? 'bg-surface shadow-soft' : 'text-muted') + '">' +
      '<span class="w-2 h-2 rounded-full shrink-0 ' + COLORS[c.color].dot + '"></span>' +
      '<span class="truncate">' + c.name + '</span>' +
      '<span class="tnum text-[12px] ' + (active ? 'text-muted' : 'text-faint') + '">' + n + '</span>' +
    '</button>';
  }).join('');
}

/* ---------- Lista móvil: tarjetas simplificadas del estado seleccionado ---------- */
function renderMobileList() {
  const el = $('#mobile-list');
  const col = COLUMNS.find(c => c.id === state.seg);
  const tasks = visibleTasks().filter(t => t.col === state.seg);
  el.innerHTML = tasks.map((t, i) => cardHTMLMobile(t, i)).join('') ||
    '<p class="rounded-2xl border border-dashed border-app px-4 py-8 text-center text-[15px] text-muted">Sin tareas en «' + col.name + '»</p>';
}

/* Tablero en todas sus formas (desktop kanban + navegación móvil) */
function renderBoards() {
  if (!isBoardView(state.view)) return; /* en pantallas auxiliares no hay tablero */
  renderBoard();
  renderSeg();
  renderMobileList();
}

/* ---------- Barra de filtros ---------- */
function filterChip(group, value, label, color, withIcon) {
  const active = state.filters[group].has(value);
  const cls = active
    ? COLORS[color].chip + ' ring-1 ring-current font-medium'
    : 'bg-surface border border-app text-muted hover:bg-surface2';
  return '<button type="button" data-fgroup="' + group + '" data-fvalue="' + value + '" aria-pressed="' + active + '" ' +
    'class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs ' + cls + '">' +
    (withIcon === 'dot' ? '<span class="w-2 h-2 rounded-full ' + COLORS[color].dot + '"></span>' : '') +
    (withIcon === 'pr' ? svg(PRIORITIES[value].icon, 'w-3 h-3') : '') +
    label + '</button>';
}

function renderFilters() {
  if (state.view !== 'todo') { filtersEl.innerHTML = ''; filtersEl.classList.add('hidden'); return; }
  filtersEl.classList.remove('hidden');
  const f = state.filters;
  const activeCount = f.projects.size + f.people.size + f.priorities.size + f.tags.size;

  const groups = [
    { label: 'Proyecto', html: PROJECTS.map(p => filterChip('projects', p.id, p.name, p.color, 'dot')).join('') },
    { label: 'Persona', html:
        filterChip('people', 'mar', 'Mar', 'violet', 'dot') +
        filterChip('people', 'jordi', 'Jordi', 'teal', 'dot') +
        filterChip('people', 'none', 'Sin asignar', 'slate', 'dot') },
    { label: 'Prioridad', html: ['alta', 'media', 'baja'].map(pr =>
        filterChip('priorities', pr, PRIORITIES[pr].label, pr === 'alta' ? 'rose' : pr === 'media' ? 'amber' : 'slate', 'pr')).join('') },
    { label: 'Etiqueta', html: Object.keys(TAGS).map(id => filterChip('tags', id, TAGS[id].name, TAGS[id].color, 'dot')).join('') }
  ];

  /* Botón "Filtros" solo en móvil (<lg): embudo + texto + contador de activos.
     El panel se colapsa con grid-rows 0fr→1fr (transición suave; prefers-reduced-motion
     ya la anula vía la regla global) y con visibility:hidden queda fuera del tab order. */
  const toggleBtn =
    '<div class="lg:hidden mb-3">' +
      '<button type="button" id="filters-toggle" aria-expanded="' + state.filtersOpen + '" aria-controls="filters-panel" ' +
        'class="inline-flex items-center gap-2 rounded-full border bg-surface px-3.5 py-2 text-[13px] font-medium shadow-soft ' +
        (activeCount
          ? 'border-emerald-500/50 text-emerald-700 dark:text-emerald-400'
          : 'border-app text-muted hover:bg-surface2') + '">' +
        svg(P.funnel, 'w-4 h-4') +
        '<span>Filtros' + (activeCount ? ' · ' + activeCount : '') + '</span>' +
        svg(P.chevDown, 'w-3.5 h-3.5 transition-transform duration-200' + (state.filtersOpen ? ' rotate-180' : '')) +
      '</button>' +
    '</div>';

  const panelCls = state.filtersOpen
    ? 'grid-rows-[1fr] visible'
    : 'grid-rows-[0fr] invisible lg:visible';

  filtersEl.innerHTML =
    toggleBtn +
    '<div id="filters-panel" class="grid transition-[grid-template-rows] duration-300 ease-out lg:grid-rows-[1fr] ' + panelCls + '">' +
      '<div class="min-h-0 overflow-hidden">' +
        '<div class="rounded-2xl bg-surface border border-app p-3.5 flex flex-wrap items-center gap-x-4 gap-y-2.5">' +
          groups.map(g =>
            '<div class="flex items-center gap-1.5 flex-wrap">' +
              '<span class="text-[11px] font-semibold tracking-wide uppercase text-faint mr-0.5">' + g.label + '</span>' + g.html +
            '</div>').join('') +
          (activeCount
            ? '<button type="button" id="clear-filters" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-surface2 text-muted hover:text-[var(--text)]">' + svg(P.x, 'w-3 h-3') + 'Limpiar filtros (' + activeCount + ')</button>'
            : '') +

}

/* ---------- Sidebar ---------- */
function isBoardView(v) {
  return v === 'todo' || PROJECTS.some(p => p.id === v);
}

function renderSidebar() {
  const itemCls = (active) =>
    'w-full flex items-center gap-2.5 rounded-xl px-3 py-2 text-sm ' +
    (active ? 'bg-surface2 font-medium' : 'text-muted hover:bg-surface2');
  const mainItem = (view, icon, label, count) =>
    '<button type="button" data-view="' + view + '" class="' + itemCls(state.view === view) + '" ' + (state.view === view ? 'aria-current="page"' : '') + '>' +
      '<span class="text-faint">' + svg(P[icon], 'w-4 h-4') + '</span>' +
      '<span class="flex-1 text-left">' + label + '</span>' +
      (count != null ? '<span class="tnum text-xs text-faint">' + count + '</span>' : '') +
    '</button>';

  /* Sección principal: Todo, Actividad y Ajustes */
  $('#side-main').innerHTML =
    mainItem('todo', 'layers', 'Todo', TASKS.filter(t => t.col !== 'hecho').length) +
    mainItem('activity', 'clock', 'Actividad') +
    mainItem('settings', 'settings', 'Ajustes');

  sideNavEl.innerHTML = PROJECTS.map(p =>
    '<button type="button" data-view="' + p.id + '" class="' + itemCls(state.view === p.id) + '" ' + (state.view === p.id ? 'aria-current="page"' : '') + '>' +
      '<span class="w-2 h-2 rounded-full shrink-0 ' + COLORS[p.color].dot + '"></span>' +
      '<span class="flex-1 text-left truncate">' + p.name + '</span>' +
      '<span class="tnum text-xs text-faint">' + openCount(p.id) + '</span>' +
    '</button>').join('');

  const sel = $('#mobile-view');
  if (isBoardView(state.view) && sel.value !== state.view) sel.value = state.view;
}

/* ---------- Cabecera de vista ---------- */
function renderHeader() {
  const titleEl = $('#view-title'), subEl = $('#view-sub'), statsEl = $('#view-stats');
  const openAll = TASKS.filter(t => t.col !== 'hecho').length;
  if (state.view === 'todo') {
    titleEl.textContent = 'Todo';
    subEl.textContent = 'Todos los proyectos en un solo tablero';
    const open = visibleTasks().filter(t => t.col !== 'hecho').length;
    statsEl.textContent = open + (open === 1 ? ' tarea abierta' : ' tareas abiertas');
  } else if (state.view === 'projects') {
    titleEl.textContent = 'Proyectos';
    subEl.textContent = 'Elige un proyecto para abrir su tablero';
    statsEl.textContent = PROJECTS.length + ' proyectos · ' + openAll + ' abiertas';
  } else if (state.view === 'activity') {
    titleEl.textContent = 'Actividad';
    subEl.textContent = 'Todos los movimientos de vuestros tableros';
    statsEl.textContent = buildFeed().length + ' eventos';
  } else if (state.view === 'settings') {
    titleEl.textContent = 'Ajustes';
    subEl.textContent = 'Perfil, apariencia y datos de la maqueta';
    statsEl.textContent = '';
  } else {
    const p = PROJECTS.find(x => x.id === state.view);
    titleEl.textContent = p.emoji + ' ' + p.name;
    subEl.textContent = 'Tablero del proyecto';
    const open = visibleTasks().filter(t => t.col !== 'hecho').length;
    statsEl.textContent = open + (open === 1 ? ' tarea abierta' : ' tareas abiertas');

}

/* ---------- Bottom-nav móvil: estado activo ---------- */
function updateBottomNav() {
  const active = {
    'bn-todo': state.view === 'todo',
    'bn-projects': state.view === 'projects' || PROJECTS.some(p => p.id === state.view),
    'bn-activity': state.view === 'activity',
    'bn-settings': state.view === 'settings'
  };
  Object.keys(active).forEach(id => {
    const b = document.getElementById(id);
    if (!b) return;
    b.classList.toggle('text-emerald-700', active[id]);
    b.classList.toggle('dark:text-emerald-400', active[id]);
    b.classList.toggle('text-faint', !active[id]);
    if (active[id]) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}

/* ---------- Cambio de vista ---------- */
function setView(v) {
  state.view = v;
  const board = isBoardView(v);
  /* Chrome móvil: el segmented control solo aparece en vistas de tablero */
  $('#seg-wrap').classList.toggle('hidden', !board);
  $('#mobile-list').classList.toggle('hidden', !board);
  boardEl.classList.toggle('lg:grid', board);
  $('#main').classList.toggle('pt-[120px]', board);
  $('#main').classList.toggle('pt-[68px]', !board);
  renderSidebar();
  renderHeader();
  renderFilters();
  renderBoards();
  renderScreen();
  updateBottomNav();
}

/* ---------- Persistencia del tablero (localStorage) ---------- */
const STORAGE_KEY = 'deltos-board-v1';
const MOVE_LOG = {};  /* taskId -> [{from,to,ts}] movimientos generados por la usuaria */
const ORIG_COL = {};  /* columna original del dataset (para la narrativa del detalle genérico) */
TASKS.forEach(t => { ORIG_COL[t.id] = t.col; });

function saveBoard() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      order: TASKS.map(t => ({ id: t.id, col: t.col })),
      moves: MOVE_LOG
    }));
  } catch (e) {}
}

function loadBoard() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}
  if (!saved || !Array.isArray(saved.order)) return;
  const byId = {};
  TASKS.forEach(t => { byId[t.id] = t; });
  const reordered = [];
  saved.order.forEach(o => {
    const t = byId[o.id];
    if (!t) return;
    if (COLUMNS.some(c => c.id === o.col)) t.col = o.col;
    reordered.push(t);
    delete byId[o.id];
  });
  Object.keys(byId).forEach(id => reordered.push(byId[id])); /* tareas nuevas del dataset */
  TASKS.length = 0;
  reordered.forEach(t => TASKS.push(t));
  if (saved.moves && typeof saved.moves === 'object') {
    Object.keys(saved.moves).forEach(id => {
      if (Array.isArray(saved.moves[id])) MOVE_LOG[id] = saved.moves[id];
    });
  }
}
loadBoard();

/* ---------- Avisador aria-live ---------- */
function announce(msg) {
  const el = document.getElementById('a11y-announce');
  if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 30);
}

/* ---------- Re-render con FLIP (desactivado con prefers-reduced-motion) ---------- */
const reducedMotionMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

function renderAll() {
  renderBoards();
  renderSidebar();
  renderHeader();
  renderScreen();
}

function flipRender() {
  if (reducedMotionMQ.matches) { renderAll(); return; }
  const before = new Map();
  boardEl.querySelectorAll('[data-task]').forEach(el => before.set(el.dataset.task, el.getBoundingClientRect()));
  boardEl.classList.add('no-anim');
  renderAll();
  boardEl.querySelectorAll('[data-task]').forEach(el => {
    const old = before.get(el.dataset.task);
    if (!old) return;
    const now = el.getBoundingClientRect();
    const dx = old.left - now.left, dy = old.top - now.top;
    if (!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    requestAnimationFrame(() => {
      el.style.transition = 'transform .28s ease';
      el.style.transform = '';
      el.addEventListener('transitionend', () => { el.style.transition = ''; }, { once: true });
    });
  });
  setTimeout(() => boardEl.classList.remove('no-anim'), 350);
}

/* ---------- Mover tarjeta: única vía de negocio (DnD y modal) ----------
   refCardId: insertar ANTES de esa tarjeta; null = al final de la columna. */
function moveTask(taskId, toCol, refCardId, source) {
  const t = TASKS.find(x => x.id === taskId);
  if (!t || !COLUMNS.some(c => c.id === toCol)) return;
  const fromCol = t.col;

  TASKS.splice(TASKS.indexOf(t), 1);
  let insertAt = TASKS.length;
  if (refCardId) {
    const ri = TASKS.findIndex(x => x.id === refCardId);
    if (ri !== -1) insertAt = ri;
  } else {
    for (let i = TASKS.length - 1; i >= 0; i--) {
      if (TASKS[i].col === toCol) { insertAt = i + 1; break; }
    }
  }
  TASKS.splice(insertAt, 0, t);
  t.col = toCol;

  if (fromCol !== toCol) {
    (MOVE_LOG[t.id] = MOVE_LOG[t.id] || []).push({ from: fromCol, to: toCol, ts: Date.now() });
    announce('Tarjeta «' + t.title + '» movida a ' + colName(toCol));
  } else {
    announce('Tarjeta «' + t.title + '» reordenada en ' + colName(toCol));
  }
  saveBoard();
  flipRender();
}

/* ---------- Drag & drop con ratón (HTML5 DnD) ---------- */
let dragId = null;
let placeholderEl = null;

function cleanupDrag() {
  dragId = null;
  if (placeholderEl) { placeholderEl.remove(); placeholderEl = null; }
  boardEl.querySelectorAll('.col-target').forEach(s => s.classList.remove('col-target'));
  boardEl.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging'));
  boardEl.querySelectorAll('[data-empty]').forEach(p => { p.style.display = ''; });
}

boardEl.addEventListener('dragstart', (e) => {
  const card = e.target.closest('[data-task]');
  if (!card) return;
  dragId = card.dataset.task;
  e.dataTransfer.setData('text/plain', dragId);
  e.dataTransfer.effectAllowed = 'move';
  placeholderEl = document.createElement('div');
  placeholderEl.className = 'drop-placeholder';
  placeholderEl.style.height = card.offsetHeight + 'px';
  placeholderEl.setAttribute('aria-hidden', 'true');
  setTimeout(() => card.classList.add('dragging'), 0); /* no ensuciar la imagen de arrastre */
});

boardEl.addEventListener('dragover', (e) => {
  if (!dragId) return;
  const section = e.target.closest('section[data-col]');
  if (!section) return;
  e.preventDefault(); /* necesario para permitir el drop */
  e.dataTransfer.dropEffect = 'move';
  boardEl.querySelectorAll('.col-target').forEach(s => { if (s !== section) s.classList.remove('col-target'); });
  section.classList.add('col-target');
  const list = section.querySelector('[data-list]');
  if (!list || !placeholderEl) return;
  /* Inserción: antes de la primera tarjeta cuyo centro vertical queda por debajo del cursor */
  const cards = Array.from(list.querySelectorAll('[data-task]')).filter(c => c.dataset.task !== dragId);
  let ref = null;
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { ref = c; break; }
  }
  const empty = list.querySelector('[data-empty]');
  if (empty) empty.style.display = 'none';
  if (ref) list.insertBefore(placeholderEl, ref);
  else list.appendChild(placeholderEl);
});

boardEl.addEventListener('drop', (e) => {
  if (!dragId) return;
  e.preventDefault();
  const section = e.target.closest('section[data-col]');
  if (!section) { cleanupDrag(); return; }
  /* La tarjeta que sigue al placeholder = referencia de inserción */
  let refId = null;
  if (placeholderEl && placeholderEl.parentElement) {
    let n = placeholderEl.nextElementSibling;
    while (n) {
      if (n.dataset && n.dataset.task) { refId = n.dataset.task; break; }
      n = n.nextElementSibling;
    }
  }
  const id = dragId, toCol = section.dataset.col;
  cleanupDrag();
  moveTask(id, toCol, refId, 'dnd');
});

boardEl.addEventListener('dragend', cleanupDrag);
</script>

<script>

  ];

    act.push({ k: 'sys', icon: 'move', text: '<b>' + USERS[creator].name + '</b> movió la tarjeta de Nuevo a ' + colName(ORIG_COL[t.id]), time: 'hace 2 días' });
  if (t.c > 0)
    act.push({ k: 'com', by: t.as === 'mar' ? 'jordi' : 'mar', text: 'Apuntado, me pongo con ello en cuanto saque un rato.', time: 'ayer' });
  return {
    desc: 'Tarea del proyecto ' + proj.name + '. Esta maqueta abre un detalle genérico con los datos básicos de la tarjeta; la descripción completa y el histórico detallado están disponibles en las tareas de ejemplo principales (presupuesto del baño, presentación Q3 y hotel de Lisboa).',
    files: t.a > 0 ? [{ name: 'documento-adjunto.pdf', size: '96 KB', by: creator, type: 'doc' }] : [],
    activity: act
  };
}

const FILE_ICON = {
  doc:    { icon: P.fileDoc,    cls: 'bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300' },
  sheet:  { icon: P.fileSheet,  cls: 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-300' },
  slides: { icon: P.fileSlides, cls: 'bg-violet-100 text-violet-600 dark:bg-violet-500/15 dark:text-violet-300' }
};

/* ---------- Modal ---------- */
const modalRoot = $('#modal-root');
let lastFocus = null;

/* Comentario (pestaña Comentarios): avatar, nombre, texto, timestamp */
function commentItem(e) {
  const u = USERS[e.by];
  return '' +
  '<li class="flex gap-3">' +
    avatar(e.by, 'w-8 h-8 text-[12px]') +

      '<p class="text-[14px]"><span class="font-semibold">' + u.name + '</span> <span class="text-[12px] text-faint">' + e.time + '</span></p>' +

}

/* Evento de actividad (pestaña Actividad): timeline de movimientos del sistema */
function eventItem(e) {
  return '' +
  '<li class="flex gap-3 items-center">' +
    '<span class="relative z-10 w-7 h-7 rounded-full bg-surface2 border border-app text-faint flex items-center justify-center shrink-0">' + svg(P[e.icon] || P.plus, 'w-3.5 h-3.5') + '</span>' +
    '<p class="text-[14px] text-muted leading-relaxed">' + e.text + ' <span class="text-faint">· ' + e.time + '</span></p>' +
  '</li>';
}

/* Tiempo relativo para los eventos generados en sesión */
function relTime(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 45) return 'ahora';
  const m = Math.round(s / 60);
  if (m < 60) return 'hace ' + m + ' min';
  const h = Math.round(m / 60);
  if (h < 24) return h === 1 ? 'hace 1 h' : 'hace ' + h + ' h';
  return new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace(/\./g, '');
}

/* Separación del timeline mock: comentarios (k:'com') vs eventos (k:'sys').
   Los eventos de adjuntar (clip) y los movimientos registrados van a Actividad. */
function commentsFor(t) {
  return (DETAILS[t.id] || genericDetail(t)).activity.filter(e => e.k === 'com');
}

function eventsFor(t) {
  const base = (DETAILS[t.id] || genericDetail(t)).activity.filter(e => e.k === 'sys');
  (MOVE_LOG[t.id] || []).forEach(mv => {
    base.push({ k: 'sys', icon: 'move',
      text: '<b>Mar</b> movió la tarjeta de ' + colName(mv.from) + ' a ' + colName(mv.to),
      time: relTime(mv.ts) });
  });
  return base;
}

/* ---------- Pestañas del detalle (estilo Nextcloud Deck) ---------- */
const TABS = [
  { id: 'detalles',    label: 'Detalles',    icon: 'info'  },

      'class="relative flex items-center gap-1 lg:gap-1.5 px-2 lg:px-3 py-2.5 -mb-px border-b-2 text-[12px] lg:text-[13px] font-medium whitespace-nowrap shrink-0 ' +

  return '' +
  '<div data-task-id="' + t.id + '" class="fixed inset-0 z-50 flex items-stretch lg:items-center lg:justify-center" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +

      /* Cabecera fija: título + tab bar (en móvil, pantalla completa con tabs bajo el título) */

        panel('detalles',

              metaItem('Proyecto',

              metaItem('Prioridad', pr
                ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[12px] font-medium ' + pr.badge + '">' + svg(pr.icon, 'w-3.5 h-3.5') + pr.label + '</span>'

/* Cambio de pestaña sin re-render completo (conserva scroll y foco) */
function setModalTab(tabId) {
  if (!TABS.some(t => t.id === tabId)) return;
  modalTab = tabId;
  modalRoot.querySelectorAll('[role="tab"]').forEach(b => {
    const active = b.dataset.tab === tabId;
    b.setAttribute('aria-selected', active ? 'true' : 'false');
    b.tabIndex = active ? 0 : -1;
    b.classList.toggle('border-emerald-500', active);
    b.classList.toggle('text-emerald-700', active);
    b.classList.toggle('dark:text-emerald-400', active);
    b.classList.toggle('border-transparent', !active);
    b.classList.toggle('text-muted', !active);
  });
  modalRoot.querySelectorAll('[data-panel-tab]').forEach(p => {
    p.hidden = p.dataset.panelTab !== tabId;
  });
}

function openModal(id, tab) {
  const t = TASKS.find(x => x.id === id);
  if (!t) return;
  lastFocus = document.activeElement;
  modalTab = (tab && TABS.some(x => x.id === tab)) ? tab : 'detalles';
  modalRoot.innerHTML = modalHTML(t);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onModalKey);
  const closeBtn = modalRoot.querySelector('[data-close-x]');
  if (closeBtn) closeBtn.focus();
}

function closeModal() {
  if (!modalRoot.innerHTML) return;
  modalRoot.innerHTML = '';
  document.body.style.overflow = '';
  document.removeEventListener('keydown', onModalKey);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

function onModalKey(e) {
  if (e.key === 'Escape') { closeModal(); return; }
  /* Navegación de pestañas con flechas (roving tabindex) */
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const tab = e.target.closest && e.target.closest('[role="tab"][data-tab]');
    if (!tab) return;
    e.preventDefault();
    const tabs = Array.from(modalRoot.querySelectorAll('[role="tab"][data-tab]'));
    const i = tabs.indexOf(tab);
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    setModalTab(next.dataset.tab);
    next.focus();
  }
}

/* ---------- Tema: modos auto / claro / oscuro ---------- */
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');

function themeMode() {
  try {
    const m = localStorage.getItem('deltos-theme');
    return (m === 'light' || m === 'dark') ? m : 'auto';
  } catch (e) { return 'auto'; }
}

function applyTheme() {
  const mode = themeMode();
  const dark = mode === 'dark' ? true : mode === 'light' ? false : darkMQ.matches;
  document.documentElement.classList.toggle('dark', dark);
  $('#meta-theme').setAttribute('content', dark ? '#080D1A' : '#F4F6FA');
  themeButtons();
  syncSettingsTheme();
}

function setThemeMode(mode) {
  try { localStorage.setItem('deltos-theme', mode); } catch (e) {}
  applyTheme();
}

/* En modo auto, seguir al sistema en vivo */
darkMQ.addEventListener('change', () => { if (themeMode() === 'auto') applyTheme(); });

function themeButtons() {
  const dark = document.documentElement.classList.contains('dark');
  const icon = dark ? svg(P.sun, 'w-[18px] h-[18px]') : svg(P.moon, 'w-[18px] h-[18px]');
  const label = dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro';
  const d = $('#theme-toggle-desktop'), m = $('#theme-toggle-mobile');
  d.innerHTML = icon + '<span>' + (dark ? 'Tema claro' : 'Tema oscuro') + '</span>';
  d.setAttribute('aria-label', label);
  m.innerHTML = icon;
  m.setAttribute('aria-label', label);
}

/* Marca la opción activa del selector de Apariencia (si Ajustes está abierto) */
function syncSettingsTheme() {
  const mode = themeMode();
  document.querySelectorAll('[data-theme-mode]').forEach(b => {
    const on = b.dataset.themeMode === mode;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.classList.toggle('bg-surface', on);
    b.classList.toggle('shadow-soft', on);
    b.classList.toggle('font-medium', on);
    b.classList.toggle('text-muted', !on);
  });
}

/* Toggle rápido del header: fuerza claro/oscuro explícito */
function toggleTheme() {
  const dark = !document.documentElement.classList.contains('dark');
  setThemeMode(dark ? 'dark' : 'light');
}

/* ---------- Feed global de actividad ---------- */
/* Parsea los tiempos relativos del dataset a minutos (hoy = 1 ago 2026) */
function parseRelMinutes(time) {
  if (time === 'ahora') return 0;
  let m = time.match(/^hace (\d+) min/); if (m) return +m[1];
  m = time.match(/^hace (\d+) h/);       if (m) return +m[1] * 60;
  if (time === 'ayer') return 1440;
  m = time.match(/^hace (\d+) días/);    if (m) return +m[1] * 1440;
  return 999999; /* fechas absolutas: al final */
}

/* Texto del evento con el título de la tarea enlazado */
function feedText(e, t) {
  const title = '«' + t.title + '»';
  let m = e.text.match(/^Tarjeta creada por (<b>.*?<\/b>)$/);
  if (m) return m[1] + ' creó ' + title;
  m = e.text.match(/^(<b>.*?<\/b>) movió la tarjeta de (.*?) a (.*?)$/);
  if (m) return m[1] + ' movió ' + title + ' de ' + m[2] + ' a ' + m[3];
  m = e.text.match(/^(<b>.*?<\/b>) adjuntó (.*?)$/);
  if (m) return m[1] + ' adjuntó ' + m[2] + ' en ' + title;
  m = e.text.match(/^(<b>.*?<\/b>) cambió la prioridad a (.*?)$/);
  if (m) return m[1] + ' cambió la prioridad de ' + title + ' a ' + m[2];
  m = e.text.match(/^(<b>.*?<\/b>) cambió el vencimiento al (.*?)$/);
  if (m) return m[1] + ' cambió el vencimiento de ' + title + ' al ' + m[2];
  return e.text + ' · ' + title;
}

/* Todos los eventos (sin comentarios) de todas las tareas, reciente primero.
   Reutiliza eventsFor(): dataset mock + movimientos de la usuaria (MOVE_LOG). */
function buildFeed() {
  const items = [];
  TASKS.forEach(t => {
    eventsFor(t).forEach(e => items.push({ task: t, e: e, mins: parseRelMinutes(e.time) }));
  });
  items.sort((a, b) => a.mins - b.mins);
  return items;
}

function dayBucketLabel(bucket) {
  if (bucket === 0) return 'Hoy';
  if (bucket === 1) return 'Ayer';
  return 'Hace ' + bucket + ' días';
}

function activityScreenHTML() {

$('#screen').addEventListener('click', (e) => {

  if (proj) { setView(proj.dataset.openProject); return; }

  /* Actividad → detalle de la tarea en su pestaña Actividad */

    const on = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', on ? 'true' : 'false');
    sw.classList.toggle('bg-emerald-500', on);
    sw.classList.toggle('bg-surface2', !on);
    const knob = sw.querySelector('span');
    if (knob) knob.classList.toggle('translate-x-5', on);
    return;
  }

  /* Ajustes → Restablecer tablero: confirmación inline (2 pasos, sin confirm()) */
  const reset = e.target.closest('#reset-board');
  if (reset) {
    if (reset.dataset.armed === '1') {
      clearTimeout(resetTimer);
      try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
      reset.querySelector('span').textContent = 'Tablero restablecido, recargando…';
      setTimeout(() => location.reload(), 350);
      return;
    }
    reset.dataset.armed = '1';
    reset.classList.remove('bg-surface2', 'border-app', 'text-muted');
    reset.classList.add('bg-rose-100', 'text-rose-700', 'dark:bg-rose-500/15', 'dark:text-rose-300', 'border', 'border-transparent');
    reset.querySelector('span').textContent = '¿Seguro? Pulsa para confirmar';
    announce('Confirma el restablecimiento pulsando de nuevo el botón');
    resetTimer = setTimeout(() => {
      delete reset.dataset.armed;
      reset.classList.add('bg-surface2', 'border-app', 'text-muted');
      reset.classList.remove('bg-rose-100', 'text-rose-700', 'dark:bg-rose-500/15', 'dark:text-rose-300', 'border-transparent');
      reset.querySelector('span').textContent = 'Restablecer tablero';
    }, 4000);
  }
});

function setSeg(seg) {
  if (!COLUMNS.some(c => c.id === seg) || state.seg === seg) return;
  state.seg = seg;
  renderSeg();
  renderMobileList();
}

$('#seg-control').addEventListener('click', (e) => {
  const b = e.target.closest('[data-seg]');
  if (b) setSeg(b.dataset.seg);
});

$('#seg-control').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const b = e.target.closest('[data-seg]');
  if (!b) return;
  e.preventDefault();
  const tabs = Array.from($('#seg-control').querySelectorAll('[data-seg]'));
  const i = tabs.indexOf(b);
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  setSeg(next.dataset.seg);
  const nb = $('#seg-control').querySelector('[data-seg="' + next.dataset.seg + '"]');
  if (nb) nb.focus();
});

filtersEl.addEventListener('click', (e) => {
  /* Toggle del panel (solo visible en <lg): actualización directa del DOM para no perder el foco */
  const toggle = e.target.closest('#filters-toggle');
  if (toggle) {
    state.filtersOpen = !state.filtersOpen;
    toggle.setAttribute('aria-expanded', state.filtersOpen ? 'true' : 'false');
    const panel = $('#filters-panel');
    if (panel) {
      panel.classList.toggle('grid-rows-[0fr]', !state.filtersOpen);
      panel.classList.toggle('grid-rows-[1fr]', state.filtersOpen);
      panel.classList.toggle('invisible', !state.filtersOpen);
      panel.classList.toggle('lg:visible', !state.filtersOpen);
      panel.classList.toggle('visible', state.filtersOpen);
    }
    const chev = toggle.querySelector('svg:last-of-type');
    if (chev) chev.classList.toggle('rotate-180', state.filtersOpen);
    return;
  }
  const clear = e.target.closest('#clear-filters');
  if (clear) {
    Object.values(state.filters).forEach(s => s.clear());
    renderFilters(); renderHeader(); renderBoards();
    return;
  }
  const chip = e.target.closest('[data-fgroup]');
  if (chip) {
    const set = state.filters[chip.dataset.fgroup];
    const v = chip.dataset.fvalue;
    if (set.has(v)) set.delete(v); else set.add(v);
    renderFilters(); renderHeader(); renderBoards();
  }
});

modalRoot.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]') || e.target.closest('[data-close-x]')) { closeModal(); return; }
  const tab = e.target.closest('[role="tab"][data-tab]');
  if (tab) { setModalTab(tab.dataset.tab); return; }
  const mv = e.target.closest('[data-move-to]');
  if (mv && !mv.disabled) {
    const dialog = modalRoot.querySelector('[data-task-id]');
    if (!dialog) return;
    const taskId = dialog.dataset.taskId;
    moveTask(taskId, mv.dataset.moveTo, null, 'modal'); /* el tablero se actualiza en vivo detrás del modal */
    /* Re-render del modal para refrescar botones y Actividad, conservando el scroll */
    const panel = modalRoot.querySelector('[data-panel]');
    const st = panel ? panel.scrollTop : 0;
    const t = TASKS.find(x => x.id === taskId);
    if (t) {
      modalRoot.innerHTML = modalHTML(t);
      const np = modalRoot.querySelector('[data-panel]');
      if (np) np.scrollTop = st;
    }
  }
});

/* ---------- Init ---------- */
(function init() {
  const sel = $('#mobile-view');
  sel.innerHTML =
    '<option value="todo">📋 Todo</option>' +
    PROJECTS.map(p => '<option value="' + p.id + '">' + p.emoji + ' ' + p.name + '</option>').join('');
  document.documentElement.lang = currentLang();
  themeButtons();
  setView('todo');
})();
</script>
