name: release

# Release estable por tag v*: empaqueta la webapp completa en formato Go —
# binario estatico (pure Go sqlite, CGO_ENABLED=0) + frontend pre-built —
# junto con deploy/ e install.sh + checksums.txt.
#
# Dos fases: la matriz build compila cada arch en paralelo (runner nativo por
# arch, sin cross-compile) y sube el tarball como artifact; el job release
# descarga TODOS los arch, genera UN unico checksums.txt con todos ellos y
# los publica en la release (issue #36). Los patterns de checksums y files
# cubren deltos_* y deltos-web_* si se anaden assets web separados (leccion
# #166 de helios: helios_* no matcheaba helios-web_*).

on:
  push:
    tags: ['v*']
  workflow_dispatch: # sin tag = empaqueta y sube como artifact de prueba

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            goarch: amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tests del server Go (race)
        working-directory: server-go
        run: go test ./... -race

      - name: Build frontend
        working-directory: app
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build binario Go estatico
        working-directory: server-go
        env:
          REF: ${{ github.ref_name }}
        run: |
          VERSION="${REF#v}"
          [ "${{ github.ref_type }}" = "tag" ] || VERSION="0.0.0-SNAPSHOT-${GITHUB_SHA::7}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X github.com/gnacho/deltos/server-go/internal/version.Version=$VERSION" \
            -o deltos-go ./cmd/server

      - name: Empaqueta release
        env:
          REF: ${{ github.ref_name }}
        run: |
          VERSION="${REF#v}"
          [ "${{ github.ref_type }}" = "tag" ] || VERSION="0.0.0-SNAPSHOT-${GITHUB_SHA::7}"
          mkdir -p stage
          cp -r app/dist stage/dist
          cp server-go/deltos-go stage/deltos-go
          cp -r deploy stage/deploy
          cp install.sh stage/install.sh
          tar -czf "deltos_${VERSION}_linux_${{ matrix.arch }}.tar.gz" -C stage .

      - name: Sube artifact por arch
        uses: actions/upload-artifact@v4
        with:
          name: deltos-${{ matrix.arch }}
          path: deltos_*.tar.gz
          retention-days: 7

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Descarga todos los tarballs (ambos arch en un directorio)
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deltos-*
          merge-multiple: true

      - name: Checksums combinado (todos los arch en un solo fichero)
        working-directory: dist
        run: |
          sha256sum deltos_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publica en la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deltos_*.tar.gz
            dist/checksums.txt
