name: CI

# Tests y smoke. El smoke arranca el servidor de verdad, comprueba health y
# versión, crea datos, hace un backup con el CLI del timer y verifica que se
# puede restaurar. Sin systemd ni root: en CI no hay systemd.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Landing typecheck + build
        working-directory: landing
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Smoke (server, backup and restore)
        working-directory: server
        run: node scripts/ci-smoke.mjs

  # Port a Go (fase 1 del go-port, epic #304): build estatico + tests con
  # race detector + vet + staticcheck. Se mantiene en paralelo con el job
  # `test` (Node) hasta el swap.
  server-go:
    name: server-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server-go/go.sum

      - name: Build
        working-directory: server-go
        run: CGO_ENABLED=0 go build -trimpath -o deltos-go ./cmd/server

      - name: Tests (race)
        working-directory: server-go
        run: go test ./... -race

      - name: Vet + staticcheck
        working-directory: server-go
        run: |
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse
        run: |
          sh -n install.sh
          for f in deploy/*.sh; do sh -n "$f"; done

      # Descarga la última release, verifica su checksum y recorre los pasos sin
      # tocar el sistema. Falla si el manifiesto, el checksum o los pasos rompen.
      # Con token: la IP compartida del runner agota la cuota anónima de la API
      # (60/h) y hace fallar el job con 403 (issue #299).
      - name: install.sh dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh install.sh --dry-run
