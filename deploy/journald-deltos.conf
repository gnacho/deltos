# ============================================================================
# journald-deltos.conf — drop-in de UNIDAD para el logging de Deltos.
#
# Deltos loguea NDJSON a stdout → journald rota (nadie más rota: ni ficheros
# propios, ni rotación in-app). Este drop-in ajusta el rate-limit POR UNIDAD
# y deja ejemplos de LogFilterPatterns para ruido residual.
#
# Instalación (host systemd, install.sh sin Docker):
#   mkdir -p /etc/systemd/system/deltos.service.d
#   install -m 0644 deploy/journald-deltos.conf \
#     /etc/systemd/system/deltos.service.d/10-logging.conf
#   systemctl daemon-reload && systemctl restart deltos
#
# El drop-in GLOBAL de journald (SystemMaxUse, MaxRetentionSec,
# MaxLevelStore=info, /var/log/journal persistente) va en
# /etc/systemd/journald.conf.d/ — ver docs/logging.md.
#
# Verificación:
#   systemctl cat deltos | grep -A5 logging
#   journalctl -u deltos --since today -o cat | head   # NDJSON por línea
# ============================================================================

[Service]
# Nivel de log de la app (default info). debug SOLO temporal:
#   systemctl edit deltos  →  Environment=LOG_LEVEL=debug
# y quitarlo al terminar (con MaxLevelStore=info en journald, el debug nunca
# toca disco aunque se olvide quitar el override).
Environment=LOG_LEVEL=info

# Rate-limit específico de la unidad: si Deltos emite más de Burst mensajes
# en IntervalSec, journald los descarta y anota "N messages suppressed".
# Generoso: un wide event por request API + eventos de negocio puntuales.
LogRateLimitIntervalSec=30s
LogRateLimitBurst=2000

# --- LogFilterPatterns (systemd >= 240): descartar patrones ruidosos --------
# Casan sobre el MENSAJE (la línea JSON), prefijo ~ = tirar. Deltos YA excluye
# /health, /api/events (SSE) y estáticos OK del wide event en origen (un log
# que no existe no puede filtrar PII), así que esto es solo red de seguridad
# por si un proxy u otro emisor mete ruido en la unidad. Ejemplos:
#
#   LogFilterPatterns=~"msg":"http_request".*"route":"/health".*"status":200
#   LogFilterPatterns=~"method":"(GET|HEAD)".*"status":(200|304)
#
# Mejor aún: cortar el access_log del healthcheck en Nginx Proxy Manager
# (access_log off en la location) para que ni siquiera se genere la línea.
# ============================================================================
